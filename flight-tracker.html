<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flight Tracker — Offline</title>
<style>
  :root{
    --bg: #0a0e14;
    --panel: #0f1621;
    --line: #223247;
    --land: #16202c;
    --land-stroke: #2c4059;
    --grid: #141d29;
    --text-dim: #5b7089;
    --text: #cdd8e3;
    --accent: #f0a63a;
    --accent-dim: rgba(240,166,58,0.28);
    --cyan: #4fd1c5;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg);
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace;
    color: var(--text);
    overflow:hidden;
    overscroll-behavior:none;
  }
  #app{
    position:relative;
    width:100vw; height:100vh;
    display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 16px 10px 16px;
    z-index: 5;
  }
  .title{
    font-family: system-ui, -apple-system, sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text);
  }
  .title span{ color: var(--accent); }
  .status-pill{
    display:flex; align-items:center; gap:6px;
    font-size: 10px; letter-spacing:0.08em; text-transform:uppercase;
    color: var(--text-dim);
    padding: 4px 9px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: rgba(255,255,255,0.02);
  }
  .dot{ width:6px; height:6px; border-radius:50%; background: var(--text-dim); flex-shrink:0; }
  .dot.live{ background: #52d17a; box-shadow: 0 0 6px #52d17a; animation: pulse 1.6s ease-in-out infinite; }
  .dot.demo{ background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  #mapWrap{
    position:relative; flex:1; min-height:0;
    background: var(--bg);
  }
  svg{ width:100%; height:100%; display:block; }
  .land{ fill: var(--land); stroke: var(--land-stroke); stroke-width: 0.6; }
  .graticule{ stroke: var(--grid); stroke-width: 0.5; fill:none; }

  .trail{ fill:none; stroke: var(--accent); stroke-width:1.3; opacity:0.55; stroke-dasharray: 2 2.4; }
  .plane-ring{ fill:none; stroke: var(--accent); opacity:0.5; }
  .plane-dot{ fill: var(--accent); }
  .plane-heading{ stroke: var(--accent); stroke-width: 1.4; }
  .accuracy{ fill: var(--accent-dim); stroke:none; }
  .dest-line{ stroke: var(--cyan); stroke-width: 1; stroke-dasharray: 1 3; opacity: 0.65; }
  .dest-marker{ fill: var(--cyan); }
  .dest-marker-ring{ fill:none; stroke: var(--cyan); opacity:0.6; }
  .dest-label{ font-family: system-ui, -apple-system, sans-serif; font-size: 9px; fill: var(--cyan); letter-spacing: 0.04em; }

  #flightBar{
    display:flex; gap:8px; padding: 0 16px 10px 16px; z-index:5;
  }
  #flightBar input{
    flex:1;
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
  }
  #flightBar input::placeholder{ color: var(--text-dim); text-transform:none; letter-spacing:normal; }
  #flightBar button{ flex: 0 0 auto; width: 92px; }
  #flightInfo{
    padding: 0 16px 10px 16px;
    font-size: 11px; color: var(--text-dim);
    display: none;
  }
  #flightInfo b{ color: var(--cyan); font-weight:600; }
  #flightInfo .route{ color: var(--text); }
  #apiKeyNote{
    font-size: 10px; color: var(--text-dim); padding: 0 16px 8px 16px;
    line-height:1.4; display:none;
  }
  #apiKeyNote code{ color: var(--accent); }

  .vignette{
    position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
  }
  .scanline{
    position:absolute; inset:0; pointer-events:none;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    mix-blend-mode: overlay;
  }

  #readout{
    z-index:5;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px 8px;
    background: linear-gradient(to top, rgba(10,14,20,0.96), rgba(10,14,20,0.75) 70%, transparent);
  }
  .metric{ display:flex; flex-direction:column; gap:2px; }
  .metric .label{
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 9px; letter-spacing:0.1em; text-transform:uppercase;
    color: var(--text-dim);
  }
  .metric .value{
    font-size: 16px; font-weight: 500; color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .metric .value small{ font-size: 10px; color: var(--text-dim); margin-left:2px; }
  .metric.accent .value{ color: var(--accent); }

  #controls{
    display:flex; gap:8px; padding: 0 16px 10px 16px;
  }
  button{
    flex:1;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 11px; letter-spacing:0.06em; text-transform:uppercase; font-weight:600;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text-dim);
    cursor:pointer;
  }
  button.active{
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(240,166,58,0.08);
  }
  button:active{ transform: scale(0.98); }

  #msg{
    position:absolute; left:16px; right:16px; top:56px;
    font-size:11px; color: var(--text-dim);
    background: rgba(15,22,33,0.9);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    line-height:1.5;
    display:none;
    z-index:6;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">Track<span>/</span>MAP</div>
    <div class="status-pill"><span class="dot" id="statusDot"></span><span id="statusText">Idle</span></div>
  </header>

  <div id="flightBar">
    <input id="flightNumInput" type="text" placeholder="Flight number, e.g. UA123" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false">
    <button id="btnLoadFlight">Load</button>
  </div>
  <div id="flightInfo"></div>
  <div id="apiKeyNote"></div>

  <div id="msg"></div>

  <div id="mapWrap">
    <svg id="svg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="ringFade" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f0a63a" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#f0a63a" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g id="graticule"></g>
      <path id="land" class="land" d=""></path>
      <path id="trail" class="trail" d=""></path>
      <line id="destLine" class="dest-line" x1="0" y1="0" x2="0" y2="0" style="display:none"></line>
      <g id="destMarker" style="display:none">
        <circle class="dest-marker-ring" r="6" cx="0" cy="0"></circle>
        <circle class="dest-marker" r="2.4" cx="0" cy="0"></circle>
        <text class="dest-label" x="8" y="3"></text>
      </g>
      <circle id="accuracy" class="accuracy" cx="0" cy="0" r="0" style="display:none"></circle>
      <g id="plane" style="display:none">
        <circle class="plane-ring" r="14" cx="0" cy="0"></circle>
        <circle class="plane-ring" r="8" cx="0" cy="0" opacity="0.7"></circle>
        <line class="plane-heading" x1="0" y1="0" x2="0" y2="-16"></line>
        <circle class="plane-dot" r="3.2" cx="0" cy="0"></circle>
      </g>
    </svg>
    <div class="vignette"></div>
    <div class="scanline"></div>
  </div>

  <div id="readout">
    <div class="metric accent"><div class="label">Lat</div><div class="value" id="mLat">—</div></div>
    <div class="metric accent"><div class="label">Lon</div><div class="value" id="mLon">—</div></div>
    <div class="metric"><div class="label">Speed</div><div class="value" id="mSpeed">—<small>kts</small></div></div>
    <div class="metric"><div class="label">Heading</div><div class="value" id="mHeading">—<small>°</small></div></div>
    <div class="metric"><div class="label">Altitude</div><div class="value" id="mAlt">—<small>ft</small></div></div>
    <div class="metric"><div class="label">Accuracy</div><div class="value" id="mAcc">—<small>m</small></div></div>
    <div class="metric"><div class="label">Fix</div><div class="value" id="mFix">—</div></div>
    <div class="metric"><div class="label">Updated</div><div class="value" id="mTime">—</div></div>
    <div class="metric"><div class="label">To Dest</div><div class="value" id="mDist">—<small>nm</small></div></div>
    <div class="metric"><div class="label">Brg</div><div class="value" id="mBearing">—<small>°</small></div></div>
    <div class="metric"><div class="label">ETA (calc)</div><div class="value" id="mEtaCalc">—</div></div>
    <div class="metric"><div class="label">ETA (sched)</div><div class="value" id="mEtaSched">—</div></div>
  </div>

  <div id="controls">
    <button id="btnLive">Live GPS</button>
    <button id="btnDemo">Demo Flight</button>
  </div>
</div>

    var cached = loadCachedDestination(flightNum);
    if (cached){
      applyDestination(flightNum, cached, true);
    }

    if (!hasApiKey()){
      showApiKeyNote(true);
      if (!cached){
        showMsg('No API key set yet, and no cached data for ' + flightNum + '. Add your RapidAPI key in the code (FLIGHT_API.RAPIDAPI_KEY) while you have wifi, then reload this flight.');
      }
      return;
    }
    showApiKeyNote(false);

    setStatus('Fetching flight…', '');
    try {
      var url = 'https://' + FLIGHT_API.RAPIDAPI_HOST + '/flights/number/' + encodeURIComponent(flightNum);
      var res = await fetch(url, {
        method: 'GET',
        headers: {
          'X-RapidAPI-Key': FLIGHT_API.RAPIDAPI_KEY,
          'X-RapidAPI-Host': FLIGHT_API.RAPIDAPI_HOST
        }
      });
      if (!res.ok) throw new Error('API returned ' + res.status);
      var data = await res.json();
      var flight = Array.isArray(data) ? data[0] : (data && data.length ? data[0] : data);
      if (!flight || !flight.arrival || !flight.arrival.airport){
        throw new Error('No flight data found for ' + flightNum);
      }

      var arr = flight.arrival;
      var dep = flight.departure;
      var dest = {
        lat: arr.airport.location.lat,
        lon: arr.airport.location.lon,
        code: arr.airport.iata || arr.airport.icao || '',
        city: arr.airport.municipalityName || arr.airport.name || '',
        schedArrivalISO: (arr.scheduledTime && (arr.scheduledTime.utc || arr.scheduledTime.local)) || null,
        originCode: dep && dep.airport ? (dep.airport.iata || dep.airport.icao || '') : ''
      };

      saveDestination(flightNum, dest);
      applyDestination(flightNum, dest, false);
      showMsg('');
    } catch(err){
      setStatus(mode === 'live' ? 'Live' : (mode === 'demo' ? 'Demo' : 'Idle'), mode);
      if (!cached){
        showMsg('Could not fetch flight info: ' + (err && err.message ? err.message : err) + '. If you\'re not on working wifi right now, this only works once cached — try again with a connection.');
      } else {
        showMsg('Using cached data from earlier — could not refresh (no/limited connection).');
      }
    }
  }

  function showApiKeyNote(show){
    var n = document.getElementById('apiKeyNote');
    if (show){
      n.style.display = 'block';
      n.innerHTML = 'No API key set. Open the file and paste a RapidAPI/AeroDataBox key into <code>FLIGHT_API.RAPIDAPI_KEY</code> near the top of the script.';
    } else {
      n.style.display = 'none';
    }
  }

  function applyDestination(flightNum, dest, fromCache){
    destination = dest;
    var infoEl = document.getElementById('flightInfo');
    infoEl.style.display = 'block';
    var etaStr = dest.schedArrivalISO ? new Date(dest.schedArrivalISO).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '—';
    infoEl.innerHTML = '<b>' + flightNum + '</b> &nbsp;<span class="route">' + (dest.originCode||'?') + ' → ' + (dest.code||'?') + '</span> &nbsp;· sched arrival ' + etaStr + (fromCache ? ' &nbsp;<span style="opacity:0.6">(cached)</span>' : '');
    document.getElementById('mEtaSched').textContent = etaStr;
    drawDestination();
  }

  function drawDestination(){
    var m = document.getElementById('destMarker');
    if (!destination){ m.style.display='none'; return; }
    var p = project(destination.lon, destination.lat);
    m.style.display = '';
    m.setAttribute('transform', 'translate('+p[0]+','+p[1]+')');
    m.querySelector('.dest-label').textContent = destination.code || '';
  }

  document.getElementById('land').setAttribute('d', LAND_PATH);

  // graticule (faint lat/lon grid every 30deg)
  (function drawGraticule(){
    var g = document.getElementById('graticule');
    var parts = [];
    for (var lon=-180; lon<=180; lon+=30){
      var a = project(lon,-85), b = project(lon,85);
      parts.push('M'+a[0]+','+a[1]+'L'+b[0]+','+b[1]);
    }
    for (var lat=-60; lat<=60; lat+=30){
      var a2 = project(-180,lat), b2 = project(180,lat);
      parts.push('M'+a2[0]+','+a2[1]+'L'+b2[0]+','+b2[1]);
    }
    var p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('class','graticule');
    p.setAttribute('d', parts.join(' '));
    g.appendChild(p);
  })();

  // ---- state ----
  var mode = null; // 'live' | 'demo'
  var trailPoints = [];
  var watchId = null;
  var demoTimer = null;
  var lastFix = null;

  var el = {
    statusDot: document.getElementById('statusDot'),
    statusText: document.getElementById('statusText'),
    msg: document.getElementById('msg'),
    plane: document.getElementById('plane'),
    trail: document.getElementById('trail'),
    accuracy: document.getElementById('accuracy'),
    btnLive: document.getElementById('btnLive'),
    btnDemo: document.getElementById('btnDemo'),
    mLat: document.getElementById('mLat'),
    mLon: document.getElementById('mLon'),
    mSpeed: document.getElementById('mSpeed'),
    mHeading: document.getElementById('mHeading'),
    mAlt: document.getElementById('mAlt'),
    mAcc: document.getElementById('mAcc'),
    mFix: document.getElementById('mFix'),
    mTime: document.getElementById('mTime')
  };

  function showMsg(text){
    el.msg.textContent = text;
    el.msg.style.display = text ? 'block' : 'none';
  }

  function setStatus(text, cls){
    el.statusText.textContent = text;
    el.statusDot.className = 'dot' + (cls ? ' '+cls : '');
  }

  function fmt(n, d){
    if (n === null || n === undefined || isNaN(n)) return '—';
    return Number(n).toFixed(d===undefined?0:d);
  }

  function updateReadout(lat, lon, speedKts, headingDeg, altFt, accM, fixLabel){
    if (speedKts != null && !isNaN(speedKts)) lastSpeedKts = speedKts;
    el.mLat.textContent = fmt(lat,3) + '°';
    el.mLon.textContent = fmt(lon,3) + '°';
    el.mSpeed.innerHTML = fmt(speedKts,0) + '<small>kts</small>';
    el.mHeading.innerHTML = fmt(headingDeg,0) + '<small>°</small>';
    el.mAlt.innerHTML = (altFt===null||altFt===undefined) ? '—<small>ft</small>' : fmt(altFt,0) + '<small>ft</small>';
    el.mAcc.innerHTML = (accM===null||accM===undefined) ? '—<small>m</small>' : fmt(accM,0) + '<small>m</small>';
    el.mFix.textContent = fixLabel || '—';
    var d = new Date();
    el.mTime.textContent = d.toTimeString().slice(0,8);
  }

  function plotPosition(lat, lon, headingDeg, accM){
    var p = project(lon, lat);
    el.plane.style.display = '';
    el.plane.setAttribute('transform', 'translate('+p[0]+','+p[1]+') rotate('+(headingDeg||0)+')');

    if (accM){
      // accM is in meters; convert roughly to map units (very rough, for visual only)
      var pxPerDeg = PROJ_SCALE * DEG2RAD; // px per degree longitude at equator
      var metersPerDeg = 111320;
      var r = Math.max(3, Math.min(40, (accM/metersPerDeg) * pxPerDeg));
      el.accuracy.setAttribute('cx', p[0]);
      el.accuracy.setAttribute('cy', p[1]);
      el.accuracy.setAttribute('r', r);
      el.accuracy.style.display = '';
    } else {
      el.accuracy.style.display = 'none';
    }

    trailPoints.push(p);
    if (trailPoints.length > 400) trailPoints.shift();
    if (trailPoints.length > 1){
      var d = 'M' + trailPoints.map(function(pt){ return pt[0]+','+pt[1]; }).join('L');
      el.trail.setAttribute('d', d);
    }

    updateDestinationLine(lat, lon, p);
  }

  function updateDestinationLine(lat, lon, planeXY){
    var line = document.getElementById('destLine');
    if (!destination){
      line.style.display = 'none';
      document.getElementById('mDist').innerHTML = '—<small>nm</small>';
      document.getElementById('mBearing').innerHTML = '—<small>°</small>';
      document.getElementById('mEtaCalc').textContent = '—';
      return;
    }
    var destXY = project(destination.lon, destination.lat);
    line.setAttribute('x1', planeXY[0]);
    line.setAttribute('y1', planeXY[1]);
    line.setAttribute('x2', destXY[0]);
    line.setAttribute('y2', destXY[1]);
    line.style.display = '';

    var distM = haversine(lat, lon, destination.lat, destination.lon);
    var distNm = distM / 1852;
    var bearing = estimateHeading(lat, lon, destination.lat, destination.lon);

    document.getElementById('mDist').innerHTML = fmt(distNm,0) + '<small>nm</small>';
    document.getElementById('mBearing').innerHTML = fmt(bearing,0) + '<small>°</small>';

    if (lastSpeedKts && lastSpeedKts > 20){
      var hours = distNm / lastSpeedKts;
      var etaDate = new Date(Date.now() + hours*3600*1000);
      document.getElementById('mEtaCalc').textContent = etaDate.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    } else {
      document.getElementById('mEtaCalc').textContent = '—';
    }
  }

  function resetTrail(){
    trailPoints = [];
    el.trail.setAttribute('d','');
  }

  // ---- LIVE GPS MODE ----
  function startLive(){
    stopAll();
    mode = 'live';
    el.btnLive.classList.add('active');
    resetTrail();

    if (!('geolocation' in navigator)){
      setStatus('No GPS', '');
      showMsg('This browser/environment has no geolocation API available.');
      return;
    }

    setStatus('Acquiring…', '');
    showMsg('Requesting location permission — allow it for live tracking. GPS works without wifi/cell signal, so this should still work on restricted airplane wifi.');

    var lastLat=null, lastLon=null, lastT=null;

    watchId = navigator.geolocation.watchPosition(function(pos){
      showMsg('');
      setStatus('Live', 'live');
      var c = pos.coords;
      var speedKts = (c.speed!=null) ? c.speed*1.94384 : estimateSpeed(lastLat,lastLon,lastT,c.latitude,c.longitude,pos.timestamp);
      var heading = (c.heading!=null && !isNaN(c.heading)) ? c.heading : estimateHeading(lastLat,lastLon,c.latitude,c.longitude);
      var altFt = (c.altitude!=null) ? c.altitude*3.28084 : null;

      plotPosition(c.latitude, c.longitude, heading, c.accuracy);
      updateReadout(c.latitude, c.longitude, speedKts, heading, altFt, c.accuracy, 'GPS');

      lastLat=c.latitude; lastLon=c.longitude; lastT=pos.timestamp;
    }, function(err){
      setStatus('GPS blocked', '');
      var reason = err && err.message ? err.message : 'Permission denied or unavailable.';
      showMsg('Could not get GPS position: ' + reason + ' — try Demo Flight to preview the map.');
    }, {
      enableHighAccuracy: true,
      maximumAge: 2000,
      timeout: 15000
    });
  }

  function estimateSpeed(lat1,lon1,t1,lat2,lon2,t2){
    if (lat1==null || !t1) return null;
    var distM = haversine(lat1,lon1,lat2,lon2);
    var dtS = (t2-t1)/1000;
    if (dtS<=0) return null;
    return (distM/dtS) * 1.94384;
  }
  function estimateHeading(lat1,lon1,lat2,lon2){
    if (lat1==null) return null;
    var y = Math.sin((lon2-lon1)*DEG2RAD) * Math.cos(lat2*DEG2RAD);
    var x = Math.cos(lat1*DEG2RAD)*Math.sin(lat2*DEG2RAD) - Math.sin(lat1*DEG2RAD)*Math.cos(lat2*DEG2RAD)*Math.cos((lon2-lon1)*DEG2RAD);
    var brng = Math.atan2(y,x) * 180/Math.PI;
    return (brng+360)%360;
  }
  function haversine(lat1,lon1,lat2,lon2){
    var R=6371000;
    var dLat=(lat2-lat1)*DEG2RAD, dLon=(lon2-lon1)*DEG2RAD;
    var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*DEG2RAD)*Math.cos(lat2*DEG2RAD)*Math.sin(dLon/2)*Math.sin(dLon/2);
    var c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R*c;
  }

  // ---- DEMO MODE (simulated transatlantic flight, JFK -> LHR) ----
  function startDemo(){
    stopAll();
    mode = 'demo';
    el.btnDemo.classList.add('active');
    resetTrail();
    setStatus('Demo', 'demo');
    showMsg('');

    var start = {lat:40.6413, lon:-73.7781}; // JFK
    var end = {lat:51.4700, lon:-0.4543};   // LHR
    var cruiseAltFt = 38000;
    var cruiseKts = 480;
    var t = 0;
    var totalSteps = 600;

    demoTimer = setInterval(function(){
      t += 1;
      var frac = (t % totalSteps) / totalSteps;
      var lat = start.lat + (end.lat-start.lat)*frac;
      var lon = start.lon + (end.lon-start.lon)*frac;
      var heading = estimateHeading(start.lat,start.lon,end.lat,end.lon);

      var climbPhase = Math.min(1, frac/0.08);
      var descPhase = Math.min(1, Math.max(0,(frac-0.9)/0.1));
      var alt = cruiseAltFt * climbPhase * (1-descPhase);
      var speed = cruiseKts * (0.35 + 0.65*climbPhase) * (1 - 0.5*descPhase);

      if (frac < 0.01) resetTrail();

      plotPosition(lat, lon, heading, null);
      updateReadout(lat, lon, speed, heading, alt, null, 'SIM');
    }, 120);
  }

  function stopAll(){
    el.btnLive.classList.remove('active');
    el.btnDemo.classList.remove('active');
    if (watchId!=null && navigator.geolocation){ navigator.geolocation.clearWatch(watchId); watchId=null; }
    if (demoTimer){ clearInterval(demoTimer); demoTimer=null; }
    el.accuracy.style.display = 'none';
  }

  el.btnLive.addEventListener('click', startLive);
  el.btnDemo.addEventListener('click', startDemo);

  var flightInput = document.getElementById('flightNumInput');
  document.getElementById('btnLoadFlight').addEventListener('click', function(){
    fetchFlightInfo(flightInput.value);
  });
  flightInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') fetchFlightInfo(flightInput.value);
  });

  if (!hasApiKey()) showApiKeyNote(true);

  setStatus('Idle');
})();
</script>
</body>
